<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>I Love You ❤️</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
html, body {
  margin: 0;
  padding: 0;
  height: 100%;
  font-family: 'Arial', sans-serif;
}

body {
  background: #ff7fa2;
  display: flex;
  flex-direction: column;
  justify-content: center;
  align-items: center;
  color: white;
  text-align: center;
  overflow: hidden;
}

h1 {
  font-size: 42px;
  font-weight: 300;
  letter-spacing: 2px;
  text-shadow: 0 0 15px rgba(255,255,255,0.6);
  margin-bottom: 50px;
}

button {
  background: #ff2f6d;
  color: white;
  border: none;
  padding: 14px 36px;
  font-size: 18px;
  border-radius: 30px;
  cursor: pointer;
  box-shadow: 0 8px 20px rgba(0,0,0,0.25);
}

.heart-line {
  margin-top: 35px;
  font-size: 28px;
}

#secret {
  display: none;
  margin-top: 40px;
  font-size: 22px;
  line-height: 1.6;
  max-width: 85%;
}

/* floating hearts */
.heart {
  position: absolute;
  bottom: -40px;
  font-size: 22px;
  animation: floatUp 5s linear infinite;
  opacity: 0.9;
}

@keyframes floatUp {
  from { transform: translateY(0); }
  to { transform: translateY(-110vh); opacity: 0; }
}
</style>
</head>

<body>

<h1>I Love You<br>Shivani 💖</h1>

<button id="surpriseBtn">Surprise Me</button>

<div class="heart-line">💞</div>

<div id="secret">
  💌 You are the most special person in my life.<br>
  Clicking YES made my heart yours forever ❤️
</div>

<script>
const btn = document.getElementById("surpriseBtn");
const secret = document.getElementById("secret");

btn.addEventListener("click", () => {
  btn.style.display = "none";
  secret.style.display = "block";

  setInterval(() => {
    const heart = document.createElement("div");
    heart.className = "heart";
    heart.innerText = "❤️";
    heart.style.left = Math.random() * 100 + "vw";
    heart.style.fontSize = (16 + Math.random() * 28) + "px";
    document.body.appendChild(heart);
    setTimeout(() => heart.remove(), 5000);
  }, 250);
});
</script>

</body>
</html>
